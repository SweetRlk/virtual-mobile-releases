<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GPS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.4.0/ol.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body,#map{width:100%;height:100%;overflow:hidden;background:#0a0c10}
  .ol-viewport{background:#0a0c10}
  
  #info{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(transparent,rgba(0,0,0,0.85));
    padding:16px 14px 12px;color:#e8edf8;
    font-family:-apple-system,'Segoe UI',Arial,sans-serif;
    font-size:13px;pointer-events:none;
    z-index:10;
  }
  #info>div{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  #info .route{font-size:15px;font-weight:700}
  #info .route span{color:rgba(232,237,248,0.5);margin:0 6px}
  #info .cargo{font-size:11px;color:rgba(232,237,248,0.45);margin-bottom:6px}
  #info .stats{display:flex;gap:12px;font-size:11px}
  #info .stats span{color:rgba(232,237,248,0.5)}
  #info .stats b{color:#e8edf8}
  
  #truck-marker{
    width:24px;height:24px;
    background:radial-gradient(circle,#3b82f6 30%,rgba(59,130,246,0.3) 80%);
    border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 12px rgba(59,130,246,0.6);
    transform:translate(-50%,-50%);
    position:absolute;pointer-events:none;
    z-index:100;display:none;
    transition:left .5s linear,top .5s linear;
  }
  #truck-marker::after{
    content:'';position:absolute;top:50%;left:50%;
    width:10px;height:10px;background:#fff;
    border-radius:50%;transform:translate(-50%,-50%);
  }

  .ol-zoom{position:absolute;top:12px;right:12px;left:auto!important;display:flex;flex-direction:column;gap:4px}
  .ol-zoom button{
    width:36px;height:36px;border-radius:8px!important;
    background:rgba(19,21,27,0.85)!important;
    color:#e8edf8!important;border:1px solid rgba(255,255,255,0.08)!important;
    font-size:18px!important;cursor:pointer;backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
  }
  .ol-zoom button:hover{background:rgba(59,130,246,0.2)!important}
</style>
</head>
<body>
<div id="map"></div>
<div id="truck-marker"></div>
<div id="info">
  <div><span class="route"><span id="gps-src">---</span><span>→</span><span id="gps-dst">---</span></span></div>
  <div class="cargo" id="gps-cargo">—</div>
  <div class="stats">
    <span>Dist <b id="gps-dist">—</b></span>
    <span>ETA <b id="gps-eta">—</b></span>
    <span>Vel <b id="gps-speed" style="color:#00c97a">0</b> km/h</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ol@v10.4.0/dist/ol.min.js"></script>
<script>
const TILE_URL = 'https://dariowouters.github.io/ts-tile-map-example/tiles/{z}/{x}/{y}.png';
const TILE_INFO_URL = 'https://dariowouters.github.io/ts-tile-map-example/tiles/TileMapInfo.json';

async function init() {
  const res = await fetch(TILE_INFO_URL);
  const info = await res.json();

  const projection = new ol.proj.Projection({
    code: 'TS-MAP',
    units: 'pixels',
    extent: [info.x1, -info.y2, info.x2, -info.y1]
  });

  const map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({
        source: new ol.source.XYZ({
          url: TILE_URL,
          projection: projection
        })
      })
    ],
    view: new ol.View({
      center: [0, 0],
      zoom: 0,
      minZoom: 0,
      maxZoom: info.maxZoom,
      projection: projection,
      extent: projection.getExtent()
    }),
    controls: [new ol.control.Zoom()]
  });

  const marker = document.getElementById('truck-marker');
  const markerOverlay = new ol.Overlay({
    element: marker,
    positioning: 'center-center',
    stopEvent: false
  });
  map.addOverlay(markerOverlay);

  // Listen for telemetry from parent window (app:// overlay)
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'telemetry') {
      updatePos(map, markerOverlay, info, e.data.data);
    }
  });

  // Also check localStorage (written by overlay)
  function pollTelemetry() {
    try {
      const raw = localStorage.getItem('gps-telemetry');
      if (raw) {
        const data = JSON.parse(raw);
        updatePos(map, markerOverlay, info, data);
      }
    } catch(_) {}
    requestAnimationFrame(pollTelemetry);
  }
  pollTelemetry();

  // Try to load from URL params (for standalone)
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.has('x') && params.has('z')) {
      const x = parseFloat(params.get('x'));
      const z = parseFloat(params.get('z'));
      const pos = gameToImage(x, z, info);
      markerOverlay.setPosition(pos);
      map.getView().setCenter(pos);
      map.getView().setZoom(2);
      marker.style.display = '';
    }
  } catch(_) {}
}

function gameToImage(x, z, info) {
  const xTot = info.x2 - info.x1;
  const yTot = info.y2 - info.y1;
  const xRel = (x - info.x1) / xTot;
  const yRel = (z - info.y1) / yTot;
  const MAX = Math.pow(2, 8) * 256;
  return [xRel * MAX - 20000, -(yRel * MAX - 34000)];
}

function updatePos(map, overlay, info, data) {
  if (!data || !data.truckX || !data.truckZ) return;
  const pos = gameToImage(data.truckX, data.truckZ, info);
  overlay.setPosition(pos);
  document.getElementById('truck-marker').style.display = '';
  map.getView().setCenter(pos);

  document.getElementById('gps-src').textContent = data.citySrc || '---';
  document.getElementById('gps-dst').textContent = data.cityDst || '---';
  document.getElementById('gps-cargo').textContent = data.cargo ? '\uD83D\uDCE6 ' + data.cargo : 'Sem carga';
  document.getElementById('gps-dist').textContent = data.routeDistance > 0 ? data.routeDistance + ' km' : '—';
  document.getElementById('gps-eta').textContent = data.routeTime || '—';
  const speedEl = document.getElementById('gps-speed');
  const spd = data.speed || 0;
  speedEl.textContent = spd;
  speedEl.style.color = spd > 100 ? '#ef4444' : spd > 80 ? '#f59e0b' : '#00c97a';
}

init();
</script>
</body>
</html>
