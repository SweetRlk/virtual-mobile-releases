<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{background:#080b14}</style>
<title>Empresas — Sweet Applications</title>
<link rel="preload" href="/css/style.css" as="style" fetchpriority="high" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/css/style.css"></noscript>
<style>
  .emp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;align-items:center;gap:16px;transition:border-color .2s}
  .emp-card:hover{border-color:rgba(59,130,246,0.3)}
  .emp-logo{width:48px;height:48px;border-radius:10px;background:rgba(59,130,246,0.1);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .emp-logo img{width:100%;height:100%;object-fit:cover}
  .emp-logo span{font-size:20px;font-weight:700;color:var(--accent)}
  .emp-info{flex:1}
  .emp-name{font-size:15px;font-weight:700}
  .emp-owner{font-size:12px;color:var(--muted);margin-top:2px}
  .emp-drivers{font-size:11px;color:var(--muted);margin-top:1px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>
      <div>
        <h1>Sweeet Applications</h1>
        <span>Empresas parceiras</span>
      </div>
    </div>
    <nav id="site-nav">
      <a href="/">Início</a>
      <a href="/ranking">Ranking</a>
      <a href="/empresas" class="active">Empresas</a>
      <a href="/register" class="nav-guest">Criar Conta</a>
      <a href="/login" class="nav-guest">Entrar</a>
      <a href="/profile" class="nav-user" style="display:none;">Perfil</a>
    </nav>
  </header>

  <h1>Empresas Parceiras</h1>
  <p class="sub">Transportadoras cadastradas no ecossistema Virtual Mobile.</p>

  <div id="emp-list" style="display:flex;flex-direction:column;gap:10px;"><div class="emp-empty" style="text-align:center;padding:40px;color:var(--muted);">Carregando...</div></div>
</div>
<footer class="wrap">Sweet Applications &mdash; Soluções para ETS2 e American Truck Simulator</footer>
<script>
const API_URL = '';
document.addEventListener('DOMContentLoaded', () => {
  const token = localStorage.getItem('token');
  if (token) {
    document.querySelectorAll('.nav-guest').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.nav-user').forEach(el => el.style.display = '');
  }
  fetch(API_URL + '/api/empresas').then(r => r.json()).then(d => {
    const list = document.getElementById('emp-list');
    if (!d.empresas || !d.empresas.length) {
      list.innerHTML = '<div class="emp-empty" style="text-align:center;padding:40px;color:var(--muted);">Nenhuma empresa cadastrada ainda.</div>';
      return;
    }
    list.innerHTML = d.empresas.map(e => {
      const initial = (e.company || '?')[0].toUpperCase();
      const logo = e.logo_url ? '<img src="' + e.logo_url + '" alt="" loading="lazy">' : '<span>' + initial + '</span>';
      return '<div class="emp-card">' +
        '<div class="emp-logo">' + logo + '</div>' +
        '<div class="emp-info">' +
        '<div class="emp-name">' + esc(e.company) + '</div>' +
        '<div class="emp-owner"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:3px;opacity:.5;"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>' + esc(e.owner) + '</div>' +
        '<div class="emp-drivers"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:3px;opacity:.5;"><rect x="4" y="6" width="16" height="12" rx="2"/><circle cx="9" cy="14" r="2" fill="currentColor"/><circle cx="15" cy="14" r="2" fill="currentColor"/><path d="M4 12h16"/></svg>' + e.drivers + ' motorista' + (e.drivers !== 1 ? 's' : '') + '</div>' +
        '</div></div>';
    }).join('');
  }).catch(() => {
    document.getElementById('emp-list').innerHTML = '<div class="emp-empty" style="text-align:center;padding:40px;color:var(--muted);">Erro ao carregar.</div>';
  });
});
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
</script>
</body>
</html>
