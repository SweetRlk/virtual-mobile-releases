<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Sweet Applications</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .login-extra{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
  .login-extra a{color:var(--accent);text-decoration:none}
  .login-extra a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">SA</div>
      <div>
        <h1>Sweet Applications</h1>
        <span>Soluções para ETS2 &amp; ATS</span>
      </div>
    </div>
    <nav>
      <a href="/">Início</a>
      <a href="/register">Criar Conta</a>
      <a href="/login" class="active">Entrar</a>
    </nav>
  </header>

  <div style="max-width:400px;margin:20px auto;">
    <h1>Entrar no Virtual Mobile</h1>
    <p class="sub">Acesse sua conta para usar o Virtual Mobile no ETS2 &amp; ATS.</p>

    <div class="card">
      <form id="login-form">
        <div class="field">
          <label for="login-user">Usuário</label>
          <input id="login-user" type="text" maxlength="20" placeholder="Seu usuário" required>
        </div>
        <div class="field">
          <label for="login-pin">PIN</label>
          <input id="login-pin" type="password" inputmode="numeric" maxlength="8" placeholder="Seu PIN numérico" required>
        </div>
        <div id="login-msg" class="msg"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Entrar</button>
      </form>
      <div class="login-extra">Ainda não tem conta? <a href="/register">Criar conta</a></div>
    </div>
  </div>
</div>
<footer class="wrap">Sweet Applications &mdash; Soluções para ETS2 e American Truck Simulator</footer>
<script src="/js/app.js"></script>
</body>
</html>
